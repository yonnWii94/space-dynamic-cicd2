version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/space-dynamic-cicd
permissions:
  - object: /home/ubuntu/space-dynamic-cicd
    owner: ubuntu
    group: ubuntu
    mode: "755"
hooks:
  ApplicationStop:
    - location: scripts/stop_app.sh
      timeout: 60
      runas: ubuntu
  BeforeInstall:
    - location: scripts/clean_instance.sh
      timeout: 300
      runas: ubuntu
  AfterInstall:
    - location: scripts/python_dependencies.sh
      timeout: 300
      runas: ubuntu
  ApplicationStart:
    - location: scripts/start_app.sh
      timeout: 60
      runas: ubuntu